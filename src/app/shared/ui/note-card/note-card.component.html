<article
  class="group relative flex h-48 cursor-pointer flex-col rounded-[1.2rem] border border-neutral-200 p-4 shadow-sm transition hover:shadow-md dark:border-neutral-700 transition-all duration-300 ease-out hover:-translate-y-1.5 hover:shadow-xl"
  [class]="cardClass()"
  (click)="open.emit(note().id)"
>
  <header class="flex items-start justify-between gap-2">
    <h3 class="line-clamp-1 font-semibold text-neutral-900 dark:text-neutral-100">{{ note().title }}</h3>
    <button
      type="button"
      class="shrink-0 rounded p-1 text-neutral-400 hover:bg-black/5 hover:text-neutral-700 dark:text-neutral-500 dark:hover:text-neutral-200"
      [class.text-amber-500]="note().pinned"
      title="Pin note"
      (click)="$event.stopPropagation(); togglePinned.emit(note().id)"
    >
      <lucide-icon [img]="pinIcon" [class]="pinIconClass()"></lucide-icon>
    </button>
  </header>

  <p class="mt-2 flex-1 overflow-hidden text-sm text-neutral-600 dark:text-neutral-300">
    {{ preview() || 'No content yet' }}
  </p>

  <footer class="mt-2 flex items-center justify-between text-xs text-neutral-500 dark:text-neutral-400">
    <span>{{ ownerLabel() }} · {{ formattedDate() }}</span>
    <button
      type="button"
      class="rounded p-1 opacity-0 hover:bg-black/5 hover:text-red-600 group-hover:opacity-100"
      title="Delete note"
      (click)="$event.stopPropagation(); deleteNote.emit(note().id)"
    >
      <lucide-icon [img]="trashIcon" class="h-4 w-4"></lucide-icon>
    </button>
  </footer>
</article>
