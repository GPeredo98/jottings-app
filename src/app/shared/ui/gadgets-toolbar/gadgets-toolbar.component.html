<div class="flex items-center gap-1 px-1 py-2">
  <button
    type="button"
    class="inline-flex h-8 w-8 items-center justify-center rounded hover:bg-black/5 dark:text-neutral-100 dark:hover:bg-white/5"
    title="Insert divider"
    (mousedown)="preventFocusLoss($event)"
    (click)="insertDivider()"
  >
    <lucide-icon [img]="dividerIcon" class="h-4 w-4"></lucide-icon>
  </button>
  <button
    type="button"
    class="inline-flex h-8 w-8 items-center justify-center rounded hover:bg-black/5 dark:text-neutral-100 dark:hover:bg-white/5"
    title="Insert table"
    (mousedown)="preventFocusLoss($event)"
    (click)="insertTable()"
  >
    <lucide-icon [img]="tableIcon" class="h-4 w-4"></lucide-icon>
  </button>
</div>
