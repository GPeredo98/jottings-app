<div class="flex h-full flex-col" [class]="cardClass()">
  <header class="flex flex-col border-b border-neutral-200/70 dark:border-neutral-700/70">
    <div class="flex min-w-0 items-center gap-2 overflow-hidden px-4 py-3">
      <a
        routerLink="/"
        class="flex shrink-0 items-center gap-1 rounded-lg px-2 py-1.5 text-sm text-neutral-600 hover:bg-black/5 dark:text-neutral-300 dark:hover:bg-white/5"
        title="Back to notes"
      >
        <lucide-icon [img]="backIcon" class="h-4 w-4"></lucide-icon>
        <span class="hidden sm:inline">Notes</span>
      </a>

      <qn-recent-tabs
        [notes]="recentNotes()"
        [activeId]="id()"
        [autoRenameId]="autoRenameId()"
        (open)="openRecentNote($event)"
        (close)="closeRecentTab($event)"
        (rename)="onRenameNote($event)"
      />
    </div>
  </header>

  <div
    #editor
    class="flex-1 overflow-y-auto px-6 py-6 text-base leading-relaxed text-neutral-900 outline-none dark:text-neutral-100"
    contenteditable="true"
    spellcheck="false" 
    autocorrect="off" 
    autocapitalize="off"
    (input)="onContentInput($event)"
  ></div>

  <footer class="relative border-t border-neutral-200/70 dark:border-neutral-700/70">
    @if (showColorPanel()) {
      <div class="fixed inset-0 z-10" (click)="showColorPanel.set(false)"></div>
    }

    <div
      class="fixed inset-x-0 bottom-0 z-20 flex flex-col gap-3 border-t border-neutral-200 bg-white px-4 py-3 shadow-[0_-4px_16px_rgba(0,0,0,0.1)] transition-transform duration-300 ease-out dark:border-neutral-700 dark:bg-neutral-900"
      [class.translate-y-0]="showColorPanel()"
      [class.translate-y-full]="!showColorPanel()"
      [class.pointer-events-none]="!showColorPanel()"
    >
      <div class="flex items-center gap-3">
        <span class="text-sm font-medium text-neutral-600 dark:text-neutral-300">Color</span>
        <div class="flex flex-1 items-center gap-2">
          @for (swatch of colorSwatches; track swatch.value) {
            <button
              type="button"
              class="h-6 w-6 rounded-full"
              [class]="swatch.swatchClass"
              [class.ring-2]="note()?.color === swatch.value"
              [class.ring-neutral-900]="note()?.color === swatch.value"
              [class.ring-offset-1]="note()?.color === swatch.value"
              [title]="swatch.label"
              (click)="selectColor(swatch.value)"
            ></button>
          }
        </div>
      </div>

      <div class="flex items-center gap-2 border-t border-neutral-200 pt-3 dark:border-neutral-700">
        <button
          type="button"
          class="flex flex-1 items-center justify-center gap-2 rounded-lg px-3 py-1.5 text-sm text-neutral-600 hover:bg-black/5 dark:text-neutral-300 dark:hover:bg-white/5"
          [class.text-amber-500]="note()?.pinned"
          (click)="togglePinned()"
        >
          <lucide-icon [img]="pinIcon" class="h-4 w-4"></lucide-icon>
          {{ note()?.pinned ? 'Unpin note' : 'Pin note' }}
        </button>
        <button
          type="button"
          class="flex flex-1 items-center justify-center gap-2 rounded-lg px-3 py-1.5 text-sm text-neutral-500 hover:bg-black/5 hover:text-red-600 dark:text-neutral-400 dark:hover:bg-white/5"
          (click)="deleteNote()"
        >
          <lucide-icon [img]="trashIcon" class="h-4 w-4"></lucide-icon>
          Delete note
        </button>
      </div>
    </div>

    <div class="flex items-center justify-between overflow-x-auto">
      <div class="flex items-center">
        <qn-formatting-toolbar />
        <div class="mx-1 h-6 w-px shrink-0 bg-neutral-200 dark:bg-neutral-700"></div>
        <qn-gadgets-toolbar />
      </div>
      <button
        type="button"
        class="mr-2 shrink-0 rounded-lg p-2 text-neutral-600 hover:bg-black/5 dark:text-neutral-300 dark:hover:bg-white/5"
        title="Note settings"
        (click)="toggleColorPanel()"
      >
        <lucide-icon [img]="settingsIcon" class="h-5 w-5"></lucide-icon>
      </button>
    </div>
  </footer>
</div>
