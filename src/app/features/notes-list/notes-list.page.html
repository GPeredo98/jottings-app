<div class="mx-auto flex h-full max-w-5xl flex-col px-6 py-8">
  <header class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-semibold text-neutral-900 dark:text-neutral-100">My Jottings</h1>
      <p class="text-sm text-neutral-500 dark:text-neutral-400">{{ currentUser() }}</p>
    </div>
    <div class="flex items-center gap-2">
      <div class="relative hidden sm:block">
        <lucide-icon
          [img]="searchIcon"
          class="pointer-events-none absolute left-2 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-400"
        ></lucide-icon>
        <input
          type="search"
          placeholder="Search notes"
          class="w-64 rounded-lg border border-neutral-300 bg-transparent py-2 pl-10 pr-3 text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-cyan-300 dark:border-neutral-700 dark:text-neutral-100"
          [value]="searchTerm()"
          (input)="onSearchInput($event)"
        />
      </div>
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-lg h-9.5 border border-neutral-300 px-4 py-2 text-sm font-medium text-neutral-700 hover:bg-neutral-100 dark:border-neutral-700 dark:text-neutral-100 dark:hover:bg-neutral-800"
        (click)="openSettings()"
      >
        <lucide-icon [img]="settingsIcon" class="h-4 w-4"></lucide-icon>
      </button>
    </div>
  </header>

  <div class="relative mb-6 sm:hidden">
    <lucide-icon
      [img]="searchIcon"
      class="pointer-events-none absolute left-2 top-1/2 h-4 w-4 -translate-y-1/2 text-neutral-400"
    ></lucide-icon>
    <input
      type="search"
      placeholder="Search notes"
      class="w-full rounded-lg border border-neutral-300 bg-transparent py-2 pl-10 pr-3 text-sm text-neutral-900 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-cyan-300 dark:border-neutral-700 dark:text-neutral-100"
      [value]="searchTerm()"
      (input)="onSearchInput($event)"
    />
  </div>

  @if (notes().length === 0) {
    <div class="flex flex-1 flex-col items-center justify-center gap-2 text-neutral-500 dark:text-neutral-400">
      @if (hasNotes()) {
        <p class="text-lg">No notes match your search</p>
      } @else {
        <p class="text-lg">No notes yet</p>
        <p class="text-sm">Create your first note to get started</p>
      }
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (note of notes(); track note.id) {
        <qn-note-card
          [note]="note"
          (open)="openNote($event)"
          (togglePinned)="togglePinned($event)"
          (deleteNote)="deleteNote($event)"
        />
      }
    </div>
  }
</div>
<button
  type="button"
  (click)="createNote()"
  class="fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-cyan-600 text-white shadow-lg transition-all duration-200 hover:bg-cyan-700 hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-cyan-300"
  aria-label="Agregar nota"
>
  <svg 
    xmlns="http://www.w3.org/2000/svg" 
    class="h-6 w-6" 
    fill="none" 
    viewBox="0 0 24 24" 
    stroke="currentColor" 
    stroke-width="2"
  >
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
  </svg>
</button>
